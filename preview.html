<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>喵喵数据库 · 视觉预览</title>
  <link rel="stylesheet" href="style.css?v=0.7.3">
  <style>
    html, body { min-height: 100%; margin: 0; background: linear-gradient(145deg, #253a32, #557265); }

  <p class="preview-note">喵喵数据库 · 静态视觉预览</p>
  <script type="module">
    import { createArchiveShell, focusLatestFloor, renderModelOptions, renderNpcs, renderPlayerProfile, renderRecallState, renderSnapshot, resetPreferenceTest, setOpen, setRetestConfirmOpen, switchTab, syncSettings } from './ui/view.js?v=0.7.3';
    const root = createArchiveShell();
    root.querySelector('[data-api-profile="select"]').innerHTML = '<option>主用接口</option><option>备用接口</option>';
    root.querySelector('[data-api-profile="name"]').value = '主用接口';
    root.addEventListener('click', (event) => {
      const tab = event.target.closest('[data-tab]');
      if (tab) {
        switchTab(root, tab.dataset.tab);
        if (tab.dataset.tab === 'summary') requestAnimationFrame(() => focusLatestFloor(root, { behavior: 'auto' }));
      }
      const retry = event.target.closest('[data-action="regenerate-floor"]');
      if (retry) {
        const record = previewSnapshot.summaries.find((item) => item.floorIndex === Number(retry.dataset.floor));
        if (record) {
          record.status = 'processing';
          record.error = '';
          renderPreview();
        }
      }
      const action = event.target.closest('[data-action]')?.dataset.action;
      if (action === 'open') setOpen(root, true);
      if (action === 'close') setOpen(root, false);
      if (action === 'open-preference-test') {
        if (root.dataset.hasPreferenceProfile === 'true') setRetestConfirmOpen(root, true);
        else { resetPreferenceTest(root); switchTab(root, 'preference-test'); }
      }
      if (action === 'close-preference-test') switchTab(root, 'advance');
      if (action === 'cancel-retest') setRetestConfirmOpen(root, false);
      if (action === 'confirm-retest') {
        setRetestConfirmOpen(root, false);
        resetPreferenceTest(root);
        switchTab(root, 'preference-test');
      }
    });
    setOpen(root, true);
    const initialTab = new URLSearchParams(location.search).get('tab');

      checkpoints: [],
      summaries: [

    root.addEventListener('input', event => { if (event.target.matches('[data-role="memory-search"]')) renderMemoryDatabase(root,previewMemory,{force:true}); });
    const { renderOverview } = await import('./ui/overview-view.js');
    const previewRecall = new URLSearchParams(location.search).get('recall');
    renderOverview(root, {
      summaries: [...previewSnapshot.summaries, { floorIndex: 6, status: 'missing' }],
      settings: { optionsEnabled: true, extraEndpoint: previewRecall ? 'https://example.com/v1/chat/completions' : '', recallEmbeddingModel: previewRecall ? 'text-embedding-3-small' : '', semanticRecallEnabled: previewRecall === 'on' },
      recall: previewRecall === 'on' ? { phase: 'injected', indexedCount: 6, recalledFloors: [1, 3] } : null,
    });
    const { renderHero } = await import('./ui/hero.js?v=0.7.3');
    renderHero(root, { floor: 8, scene: '雨夜，旧宅档案室', chat: '林素' });
    const { renderPushCard } = await import('./ui/push-card.js');
    renderPushCard(root, {
      enabled: true,
      round: { source: 'api', ways: ['present'], text: '' },

      goal: '慢慢揭开三年前登记簿缺页的真相',

        { floor: 3, ways: ['deadlines'], plan: '林素提醒：明早档案就要移交，今晚是最后的机会。', source: 'api' },
        { floor: 5, ways: ['offscreen', 'clues'], plan: '', source: 'local' },
        { floor: 7, ways: [], skipped: true },
      ],
    });
    const { renderPromptViewer, selectRecord, filterPromptRows } = await import('./ui/prompt-view.js');
    const lines = ['推门进了旧宅。','林素抬头，示意你把伞放在门边。','问她登记簿里少了哪一页。','她翻到中间，指着被撕掉的地方：“三年前就没了。”','那就去西廊找沈砚。','沈砚不在，只有一盏还温着的灯。','把灯提起来照照墙。','墙上有新刮的痕迹，像是有人刚搬走了什么。'];

    const finalPrompt = [

      { role: 'system', content: '【喵喵数据库 · 剧情总摘要】\n以下是本聊天已经发生的剧情……\n\n【玩家本人说过的话】\n【玩家】主题：节奏；类别：喜欢；内容：慢热，别急着推感情线\n\n【当前剧情状态】\n【时间地点】时间：雨夜；地点：旧宅档案室\n【人物档案】姓名：林素；当前状态：核对登记簿\n\n【角色回复】第 2 楼：林素示意玩家把伞放在门边。' },
      ...demoChat.slice(2).map((m) => ({ role: m.is_user ? 'user' : 'assistant', content: m.mes })),

    ];
    const demoRecords = [{ key: 'demo-1', targetFloor: 9, type: 'normal', startedAt: '2026-10-13T13:58:00+08:00', finalPrompt, budget: { limit: 6000, story: 412, recall: 0, dropped: { duplicate: 1, budget: 0 } }, memories: [{ table: 'player', id: '节奏' }, { table: 'characters', id: '林素' }] }];
    const countTokens = async (text) => ({ value: Math.ceil(text.length * 0.75), exact: false });
    const showViewer = () => renderPromptViewer(root, { records: demoRecords, chat: demoChat, floorTexts: demoChat.map((m) => m.mes), database: previewMemory, countTokens });
    showViewer();
    root.addEventListener('input', (event) => { if (event.target.matches('[data-role="prompt-search"]')) filterPromptRows(root, event.target.value); });
    const { renderSendHistory: renderSendHistoryOnly } = await import('./ui/send-view.js');
    const renderSendHistory = (target, records) => { renderSendHistoryOnly(target, records); renderOverview(target, { sends: records }); };
    renderSendHistory(root, [
      {key:'example-2',targetFloor:7,type:'swipe',startedAt:'2026-10-09T10:01:00+08:00',status:'received',verified:true,includedFloors:[0,1,2,3,4,5],removedFloors:[0],rawFloors:[{floorIndex:5,role:'玩家',text:'去档案室找林素核对登记簿。'}],memories:[{label:'人物档案',text:'林素 · 档案保管人',reason:'当前交互对象'},{label:'物品资源',text:'登记簿 · 林素持有',reason:'正文明确提及'}],summaryPrompt:'【当前剧情状态】\n雨夜，旧宅档案室。林素持有登记簿。\n【相关往事】\n林素答应核对被修改的日期。',note:'界面示例记录，用于展示展开内容。'},

    root.addEventListener("change", (event) => { if (event.target.matches("[data-setting=\"uiTheme\"]")) root.dataset.ssaTheme = event.target.value; });
    syncSettings(root, { uiTheme: new URLSearchParams(location.search).get("theme") || "chunlai", heroArt: new URLSearchParams(location.search).get("art") || "night",
